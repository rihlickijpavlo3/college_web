<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a6984"/>
      <stop offset="100%" stop-color="#d4b483"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky1)"/>
  <!-- Mountains in background -->
  <polygon points="0,380 160,280 320,380" fill="#6c7a89" opacity="0.6"/>
  <polygon points="200,380 420,240 600,380" fill="#5c6b73" opacity="0.5"/>
  <polygon points="450,380 650,260 800,380" fill="#6c7a89" opacity="0.6"/>
  <!-- Ground -->
  <rect y="380" width="800" height="120" fill="#3b3a36"/>
  <!-- Drohobych Town Hall Silhouette -->
  <rect x="350" y="210" width="100" height="170" fill="#2c2a29"/>
  <rect x="370" y="110" width="60" height="100" fill="#2c2a29"/>
  <polygon points="360,110 400,40 440,110" fill="#1f1e1d"/>
  <!-- Clock on tower -->
  <circle cx="400" cy="140" r="14" fill="#f7f1e3"/>
  <!-- Windows -->
  <rect x="385" y="170" width="12" height="24" rx="6" fill="#f7f1e3"/>
  <rect x="405" y="170" width="12" height="24" rx="6" fill="#f7f1e3"/>
  <rect x="365" y="235" width="18" height="30" rx="3" fill="#f7f1e3"/>
  <rect x="392" y="235" width="18" height="30" rx="3" fill="#f7f1e3"/>
  <rect x="419" y="235" width="18" height="30" rx="3" fill="#f7f1e3"/>
  <!-- Church of St. George wooden silhouette -->
  <polygon points="120,380 180,310 240,380" fill="#262220"/>
  <polygon points="140,310 180,240 220,310" fill="#1f1b1a"/>
  <polygon points="160,240 180,190 200,240" fill="#141211"/>
  <!-- Text -->
  <text x="400" y="440" font-family="Georgia, serif" font-size="32" fill="#f7f1e3" text-anchor="middle" font-weight="bold">ДРОГОБИЧ — МІСТО СОЛІ ТА ВЕЛЕЧІ</text>
  <text x="400" y="475" font-family="sans-serif" font-size="16" fill="#d4b483" text-anchor="middle">Площа Ринок • Ратуша • Солеварня XIII ст. • Церква св. Юра</text>
</svg>
